r(--c);z-index:2}.home:before{content:"";position:absolute;inset:13%;border-radius:13px;background:linear-gradient(145deg,#f5f9ff,#bbc9dc 58%,#eaf2ff);box-shadow:inset 0 3px 8px #24304750,0 1px 3px #fff8}.home.tl{--c:#10dc8e;left:1.2%;top:1.2%}.home.tr{--c:#ffc62e;right:1.2%;top:1.2%}.home.bl{--c:#fb4166;left:1.2%;bottom:1.2%}.home.br{--c:#2884ff;right:1.2%;bottom:1.2%}.tokens{position:absolute;inset:21%;z-index:3;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:center}.token{width:56%;height:56%;min-width:18px;min-height:18px;position:relative;border-radius:50%;background:radial-gradient(circle at 32% 23%,#ffffff 0 4%,color-mix(in srgb,var(--c),white 38%) 8%,var(--c) 37%,color-mix(in srgb,var(--c),#070d19 51%) 75%);border:2px solid #effaff;box-shadow:0 4px 0 color-mix(in srgb,var(--c),#050914 36%),0 6px 7px #0009,0 0 8px var(--c),inset 0 2px 3px #fff;display:grid;place-items:center}.token:before{content:"";position:absolute;width:36%;height:36%;top:-13%;border-radius:50%;background:radial-gradient(circle at 35% 27%,#fff,color-mix(in srgb,var(--c),white 35%) 35%,#182237 78%);border:1px solid white;box-shadow:0 0 4px var(--c)}.token:after{content:"";position:absolute;width:68%;height:29%;bottom:5%;border-radius:50%;background:#fff5;filter:blur(1px)}.tl .token{--c:#13e398}.tr .token{--c:#ffbe28}.bl .token{--c:#ff3f67}.br .token{--c:#2789ff}.center{position:absolute;z-index:4;left:40%;top:40%;width:20%;height:20%;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:conic-gradient(from -45deg,#13d88d 0 25%,#ffc52d 25% 50%,#2785ff 50% 75%,#ff4167 75%);filter:drop-shadow(0 0 8px #fff)}.center:after{content:"♛";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:32%;height:32%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#ffe6a2,#9f5b12 67%,#171a29);border:1px solid #fff3;font-size:clamp(10px,4vw,20px);color:#fff6c9;text-shadow:0 0 5px #fff}

<body><main class="stage">

<section class="players">
 <article class="player" style="--team:#18e7a1"><div class="portrait"><img src="../assets/players/rohan.png"></div><div class="pinfo"><div class="name"><span class="flag">🇮🇳</span> Rohan</div><div class="status">● YOUR TURN</div><div class="minirow"><i class="mini"></i><i class="mini"></i><i class="mini"></i><i class="mini"></i></div></div><span class="crown-badge">♛</span><span class="turn">TURN</span></article>
 <article class="player" style="--team:#ffbe36"><div class="pinfo"><div class="name"><span class="flag">🇮🇳</span> Diya</div><div class="status">● THINKING…</div><div class="minirow"><i class="mini"></i><i class="mini"></i><i class="mini"></i><i class="mini"></i></div></div><div class="portrait"><img src="../assets/players/diya.png"></div></article>
</section>
<section class="board-wrap"><div class="board"><div class="grid" id="grid"></div>
 <div class="home tl"><div class="tokens"><i class="token"></i><i class="token"></i><i class="token"></i><i class="token"></i></div></div><div class="home tr"><div class="tokens"><i class="token"></i><i class="token"></i><i class="token"></i><i class="token"></i></div></div><div class="home bl"><div class="tokens"><i class="token"></i><i class="token"></i><i class="token"></i><i class="token"></i></div></div><div class="home br"><div class="tokens"><i class="token"></i><i class="token"></i><i class="token"></i><i class="token"></i></div></div><div class="center"></div>
 </div></section>

</main>
<script>
const grid=document.querySelector('#grid');
// A conventional 15×15 Ludo layout: track cells, four six-cell home lanes, and safe markers.
const path=new Set(); for(let c=1;c<=5;c++)path.add(`6,${c}`);for(let r=1;r<=5;r++)path.add(`${r},8`);for(let c=9;c<=13;c++)path.add(`8,${c}`);for(let r=1;r<=5;r++)path.add(`${r},6`);
for(let c=9;c<=13;c++)path.add(`6,${c}`);for(let r=9;r<=13;r++)path.add(`${r},8`);for(let c=1;c<=5;c++)path.add(`8,${c}`);for(let r=9;r<=13;r++)path.add(`${r},6`);
const safe=new Set(['6,1','2,6','1,8','6,13','8,12','13,8','12,6','8,2']);
for(let r=0;r<15;r++)for(let c=0;c<15;c++){const el=document.createElement('i');el.className='cell';const key=`${r},${c}`;
 if(path.has(key)){el.classList.add('track');if(safe.has(key))el.classList.add('safe');}
 if(r>=1&&r<=5&&c===7)el.classList.add('path-green');if(r===7&&c>=9&&c<=13)el.classList.add('path-yellow');if(r>=9&&r<=13&&c===7)el.classList.add('path-blue');if(r===7&&c>=1&&c<=5)el.classList.add('path-red');
 grid.appendChild(el)}
// Keep the board's four homes and the actual three-cell cross readable; the unused quadrants stay dark glass.
for(let r=0;r<15;r++)for(let c=0;c<15;c++){const el=grid.children[r*15+c];if(r>=6&&r<=8||c>=6&&c<=8)el.classList.add('track');else el.classList.remove('track','safe');}
// Turn each counter into a small armored avatar standing over a team-lit plinth.
document.querySelectorAll('.home').forEach(home=>home.querySelectorAll('.token').forEach(token=>{token.innerHTML='<svg viewBox="0 0 40 58" aria-hidden="true"><defs><linearGradient id="armor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".23" stop-color="var(--c)"/><stop offset=".7" stop-color="color-mix(in srgb,var(--c),#111827 28%)"/><stop offset="1" stop-color="#101827"/></linearGradient></defs><ellipse cx="20" cy="53" rx="14" ry="3.4" fill="var(--c)" opacity=".62"/><path d="M13 38 10 50h6l4-8 4 8h6l-3-13" fill="url(#armor)" stroke="#f4fbff" stroke-width=".8"/><path d="M11 23 7 34l4 2 5-7m13-6 4 11-4 2-5-8" fill="url(#armor)" stroke="#f4fbff" stroke-width="1" stroke-linejoin="round"/><path d="m13 20 7-3 7 3 3 15-5 5h-9l-5-5z" fill="url(#armor)" stroke="#fff" stroke-width="1"/><path d="m16 23 4-2 4 2-1 9h-6z" fill="var(--c)" stroke="#fff9" stroke-width=".7"/><circle cx="20" cy="11" r="6" fill="url(#armor)" stroke="#fff" stroke-width="1"/><path d="M13.5 10q1-8 6.5-8t6.5 8l-6.5-2z" fill="url(#armor)" stroke="#fff" stroke-width=".8"/><path d="m16 12 3-1m2 0 3 1" stroke="#111827" stroke-width="1"/></svg>'}));
</script></body></html>
